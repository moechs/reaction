---
patterns:
  num:
    regex: '[0-9]{3}'
  ip:
    regex: '(?:(?:[0-9]{1,3}\.){3}[0-9]{1,3})|(?:[0-9a-fA-F:]{2,90})'
    ignore:
      - 1.0.0.1

streams:
  tailDown1:
    cmd: [ 'sh', '-c', 'sleep 2; seq 1000100 | while read i; do echo found $i; done' ]
    filters:
      find:
        regex:
          - '^found <num>'
        retry: 480
        retryperiod: 1m
        actions:
          damn:
            cmd: [ 'sleep', '0.0<num>' ]
          undamn:
            cmd: [ 'sleep', '0.0<num>' ]
            after: 1m
            onexit: false
  tailDown2:
