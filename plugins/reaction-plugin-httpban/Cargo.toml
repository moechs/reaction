[package]
name = "reaction-plugin-httpban"
description = "HTTP soft ban plugin for reaction"
version = "0.0.1"
edition = "2024"
authors = ["ppom <reaction@ppom.me>"]
license = "AGPL-3.0"
homepage = "https://reaction.ppom.me"
repository = "https://framagit.org/ppom/reaction"
keywords = ["security", "waf", "fail2ban", "http", "monitoring"]
default-run = "reaction-plugin-httpban"

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
remoc.workspace = true
reaction-plugin.path = "../reaction-plugin"
serde.workspace = true
serde_json.workspace = true
prefix-trie = "0.10.1"
ipnet = "2.12.1"

[dev-dependencies]
tempfile.workspace = true

[package.metadata.deb]
section = "net"
assets = [
	[ "target/release/reaction-plugin-httpban", "/usr/bin/reaction-plugin-httpban", "755" ],
]
depends = ["reaction"]
