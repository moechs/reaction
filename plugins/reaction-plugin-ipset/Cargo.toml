[package]
name = "reaction-plugin-ipset"
description = "ipset plugin for reaction"
version = "1.0.1"
edition = "2024"
authors = ["ppom <reaction@ppom.me>"]
license = "AGPL-3.0"
homepage = "https://reaction.ppom.me"
repository = "https://framagit.org/ppom/reaction"
keywords = ["security", "firewall", "fail2ban", "ipset", "monitoring"]
default-run = "reaction-plugin-ipset"

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
remoc.workspace = true
reaction-plugin.path = "../reaction-plugin"
serde.workspace = true
serde_json.workspace = true
# FIXME use upstream again as soon as https://github.com/lazytiger/ipset/pull/22 is merged and released
ipset = { git = "https://github.com/ppom0/ipset", branch = "fix-ipv6-32cidr" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "process"] }

[package.metadata.deb]
section = "net"
assets = [
	[ "target/release/reaction-plugin-ipset", "/usr/bin/reaction-plugin-ipset", "755" ],
]
depends = ["libipset-dev", "reaction"]
