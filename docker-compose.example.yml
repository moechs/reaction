# Deployment example; adjust image and paths as needed.
# Host networking and NET_ADMIN are required; plugins need systemd: false.
# For non-root, use user: "1000:1000" and chown ./reaction/data to 1000:1000.
services:
  reaction:
    image: moechs/reaction:latest
    container_name: reaction
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    cap_add:
      - NET_ADMIN
    stop_grace_period: 30s
    volumes:
      - ./reaction/config:/etc/reaction:ro
      - ./reaction/data:/var/lib/reaction
      - /var/log/secure:/var/log/secure:ro
      - /var/log/nginx:/var/log/nginx:ro
      # For reaction-plugin-container (stream type `docker`). The plugin reads
      # logs through the Engine API only; it does not need direct access to
      # /var/lib/docker/containers (which contains credentials in config.v2.json).
      # Socket access is root-equivalent and `:ro` does not restrict the API:
      # prefer a read-only socket proxy allowing only /containers/json, /events,
      # /containers/{id}/logs and /containers/{id}/json.
      # - /var/run/docker.sock:/var/run/docker.sock
